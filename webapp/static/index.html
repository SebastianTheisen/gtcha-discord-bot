<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GTCHA Tracker">
  <meta name="referrer" content="no-referrer">
  <title>GTCHA Tracker</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-180.png?v=4">
  <link rel="icon" type="image/png" href="/static/icon-180.png?v=4">
  <link rel="stylesheet" href="/static/style.css?v=101">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <img src="/static/icon-180.png?v=4" alt="" class="brand-icon">
      <span class="brand-name">GTCHA <b>Tracker</b></span>
    </a>
    <div class="top-actions">
      <span class="unofficial" title="Private App, nicht von GTCHA">inoffiziell</span>
      <a id="bell" class="refresh bell" href="#/inbox" aria-label="Benachrichtigungen" title="Benachrichtigungen">🔔<span id="bell-count" class="bell-count" hidden></span></a>
      <button id="refresh" class="refresh" type="button" aria-label="Aktualisieren" title="Aktualisieren">↻</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar">
    <a href="#/" data-tab="list"><span class="tab-icon">🎴</span><span>Banner</span></a>
    <a href="#/hot" data-tab="hot"><span class="tab-icon">🔥</span><span>Top 10</span></a>
    <a href="#/search" data-tab="search"><span class="tab-icon">🔍</span><span>Suche</span></a>
    <a href="#/users" data-tab="users" id="users-tab" hidden><span class="tab-icon">👥</span><span>Nutzer</span></a>
    <a href="#/settings" data-tab="settings"><span class="tab-icon">👤</span><span>Ich</span></a>
  </nav>

  <script src="/static/app.js?v=101"></script>
</body>
</html>
