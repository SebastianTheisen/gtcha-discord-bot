name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-webapp.txt
      - name: Browser für den Oberflächen-Test
        # Paketquellen von GitHub hängen gelegentlich: je Versuch höchstens 3 Minuten, bis zu 3 Versuche
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            timeout 180 python -m playwright install --with-deps chromium && exit 0
            echo "Versuch $i hing oder schlug fehl - neuer Versuch"
          done
          exit 1
      - name: Tests
        run: python -m pytest -q tests
      - name: Syntax aller Module prüfen
        run: python -m compileall -q bot database scraper utils tools webapp main.py config.py
