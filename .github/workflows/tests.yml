name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-webapp.txt
      - name: Browser für den Oberflächen-Test
        # Browser kommt direkt von Playwright; die Systempakete (apt) hängen bei GitHub gelegentlich -
        # die meisten sind auf dem Runner schon da, daher nur versuchen. Fehlt wirklich etwas, schlägt
        # der Oberflächen-Test selbst deutlich fehl.
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do timeout 180 python -m playwright install chromium && break; sleep 5; done
          timeout 240 sudo env "PATH=$PATH" python -m playwright install-deps chromium || echo "::warning::Systempakete nicht vollständig installiert"
          python -m playwright install chromium
      - name: Tests
        run: python -m pytest -q tests
      - name: Syntax aller Module prüfen
        run: python -m compileall -q bot database scraper utils tools webapp main.py config.py
